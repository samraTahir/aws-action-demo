name: CloudFormation Build and Deploy

on:
  push:
    branches:
      - dev
      - f1
      - f2
      - f3
      - f4
      - f5
      - f6
      - f7
      - f8
      - f9
      - uat

concurrency:
  group: cfn-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  STACK_PREFIX: cf-demo
  TEMPLATE_FILE: infra/template.yaml

jobs:
  deploy_current_branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Compute names
        id: names
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "stack=${{ env.STACK_PREFIX }}-$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Deploy CloudFormation stack
        continue-on-error: true
        run: |
          aws cloudformation deploy \
            --stack-name "${{ steps.names.outputs.stack }}" \
            --template-file "${{ env.TEMPLATE_FILE }}" \
            --parameter-overrides \
              Branch="${{ steps.names.outputs.branch }}" \
              CommitSha="${{ github.sha }}" \
            --no-fail-on-empty-changeset \
            --region "${{ env.AWS_REGION }}"

      - name: Show stack outputs
        continue-on-error: true
        run: |
          aws cloudformation describe-stacks \
            --stack-name "${{ steps.names.outputs.stack }}" \
            --query "Stacks[0].Outputs" \
            --output table \
            --region "${{ env.AWS_REGION }}"
